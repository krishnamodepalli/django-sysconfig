[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-sysconfig"
version = "0.1.0"
description = "A Magento-style system configuration app for Django"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Modepalli" }]
keywords = ["django", "configuration", "settings", "admin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.11"
dependencies = [
    "django>=4.2",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "black>=24.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/krishnamodepalli/django-sysconfig"
Repository = "https://github.com/krishnamodepalli/django-sysconfig"
Issues = "https://github.com/krishnamodepalli/django-sysconfig/issues"

[tool.hatch.build.targets.wheel]
packages = ["django_sysconfig"]

[tool.hatch.build.targets.sdist]
include = [
    "django_sysconfig/",
    "tests/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]
