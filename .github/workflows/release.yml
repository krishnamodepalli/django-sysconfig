name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (leave as 'auto' to detect from commits)"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

jobs:
  release:
    name: Bump version, tag & publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write      # needed to push version bump commit + tag
      id-token: write      # needed for PyPI Trusted Publisher (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0         # full history so we can read all commits
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install hatchling commitizen build

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ------------------------------------------------------------------  #
      #  Determine the bump type                                            #
      #  - if 'auto': read conventional commits since last tag              #
      #  - if manual: use the input directly                                #
      # ------------------------------------------------------------------  #
      - name: Determine bump type
        id: bump_type
        run: |
          if [ "${{ github.event.inputs.bump }}" != "auto" ]; then
            echo "bump=${{ github.event.inputs.bump }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get commits since last tag (or all commits if no tag yet)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s" ${LAST_TAG}..HEAD)
          fi

          echo "Commits since last release:"
          echo "$COMMITS"

          # Detect bump level from conventional commits
          if echo "$COMMITS" | grep -qE "^(feat|fix|refactor|perf|chore|docs|style|test|build|ci)(\(.+\))?!:|BREAKING CHANGE"; then
            echo "bump=major" >> $GITHUB_OUTPUT
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            echo "bump=minor" >> $GITHUB_OUTPUT
          else
            echo "bump=patch" >> $GITHUB_OUTPUT
          fi

      - name: Show detected bump type
        run: echo "Bumping version as → ${{ steps.bump_type.outputs.bump }}"

      # ------------------------------------------------------------------ #
      #  Bump version in pyproject.toml using hatch                        #
      # ------------------------------------------------------------------ #
      - name: Bump version
        id: versioning
        run: |
          OLD_VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")

          hatch version ${{ steps.bump_type.outputs.bump }}

          NEW_VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")

          echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION"        >> $GITHUB_OUTPUT

      - name: Show version bump
        run: |
          echo "Version: ${{ steps.versioning.outputs.old_version }} → ${{ steps.versioning.outputs.new_version }}"

      # ------------------------------------------------------------------ #
      #  Generate changelog from conventional commits                       #
      # ------------------------------------------------------------------ #
      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${LAST_TAG}..HEAD)
          fi

          # Write changelog to a file (avoids multiline env var issues)
          cat <<EOF > /tmp/changelog.md
          ## What's Changed

          $COMMITS

          **Full changelog:** https://github.com/krishnamodepalli/django-sysconfig/compare/${LAST_TAG}...v${{ steps.versioning.outputs.new_version }}
          EOF

          cat /tmp/changelog.md

      # ------------------------------------------------------------------ #
      #  Commit version bump + create tag                                   #
      # ------------------------------------------------------------------ #
      - name: Commit and tag
        run: |
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.versioning.outputs.new_version }}"
          git tag "v${{ steps.versioning.outputs.new_version }}"
          git push origin master
          git push origin "v${{ steps.versioning.outputs.new_version }}"

      # ------------------------------------------------------------------ #
      #  Build distribution                                                  #
      # ------------------------------------------------------------------ #
      - name: Build package
        run: python -m build

      - name: Verify dist contents
        run: ls -lh dist/

      # ------------------------------------------------------------------ #
      #  Publish to PyPI via Trusted Publisher (no API token needed)        #
      # ------------------------------------------------------------------ #
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # ------------------------------------------------------------------ #
      #  Create GitHub Release with changelog                               #
      # ------------------------------------------------------------------ #
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.versioning.outputs.new_version }}"
          name: "v${{ steps.versioning.outputs.new_version }}"
          body_path: /tmp/changelog.md
          files: dist/*
