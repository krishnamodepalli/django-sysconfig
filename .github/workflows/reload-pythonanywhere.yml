name: Reload PythonAnywhere Web App

on:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  reload:
    runs-on: ubuntu-latest

    steps:
      - name: Reload PythonAnywhere Web App
        run: |
          body=$(mktemp)

          http_status=$(curl -s \
            --connect-timeout 10 \
            --max-time 30 \
            -o "$body" \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}" \
            "https://www.pythonanywhere.com/api/v0/user/${{ secrets.PA_USERNAME }}/webapps/${{ secrets.PA_DOMAIN }}/reload/") || true

          echo "HTTP status: ${http_status:-<no response>}"
          echo "Response body: $(cat "$body")"

          if [ "${http_status}" != "200" ]; then
            echo "Reload failed with status '${http_status}'"
            exit 1
          fi

          echo "Web app reloaded successfully"
